name: Hospitality System CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: hospitality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hospitality_ci
          POSTGRES_PASSWORD: hospitality_ci_password
          POSTGRES_DB: hospitality_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospitality_ci -d hospitality_ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hospitality_ci:hospitality_ci_password@localhost:5432/hospitality_ci_db?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production-123456789
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production-123456789
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run lint checks
        run: npm run lint --if-present

      - name: Run automated tests
        run: npm test --if-present

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Create production build
        env:
          NODE_ENV: production
        run: npm run build
